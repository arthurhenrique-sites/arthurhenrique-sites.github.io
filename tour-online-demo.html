<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tour online · Apartamento 2 dormitórios</title>
<meta name="description" content="Visita online do apartamento: ande pelos cômodos direto do celular.">
<meta property="og:title" content="Tour online · Apartamento 2 dormitórios">
<meta property="og:description" content="Faça a visita online: ande pelos cômodos direto do celular.">
<meta property="og:image" content="imobdemo-sala.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--glass:rgba(12,16,20,.62);--line:rgba(255,255,255,.18);--acc:#f2b84b;--bg:#0b0e11}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
.layer{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;will-change:transform,opacity}
.layer .img{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:16/10;min-width:100%;transform:translateX(-50%);background-size:cover;background-position:center}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:#fff;font:700 13px Manrope;cursor:pointer;z-index:3}
.hs i{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid #fff;backdrop-filter:blur(4px);display:grid;place-items:center;animation:pulse 2s infinite}
.hs i svg{width:22px;height:22px}
.hs span{background:var(--glass);padding:5px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(6px)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
header{position:fixed;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:5;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
header>*{pointer-events:auto}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-weight:600;font-size:11px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.room{background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;backdrop-filter:blur(8px)}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--glass);padding:14px 18px;border-radius:14px;font-weight:600;font-size:14px;text-align:center;z-index:6;transition:opacity .5s;backdrop-filter:blur(8px);max-width:80vw}
.hint.off{opacity:0;pointer-events:none}
#map{position:fixed;right:16px;top:70px;width:150px;z-index:5;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px;backdrop-filter:blur(8px)}
#map svg{width:100%;display:block}
#map rect{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.45);stroke-width:1;cursor:pointer;transition:fill .3s}
#map rect.on{fill:var(--acc)}
#map text{fill:#fff;font:700 6.5px Manrope;pointer-events:none}
footer{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7) 35%)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--glass);color:#fff;font:600 13px Manrope;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
.chips button.on{background:#fff;color:#111}
.info{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.info b{font-size:20px;font-weight:800}
.info p{font-size:13px;opacity:.85}
.cta{background:var(--acc);color:#1a1205;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:12px;font-size:14px;white-space:nowrap}
.tag{position:fixed;left:16px;bottom:auto;top:70px;z-index:5;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.5);padding:5px 8px;border-radius:6px;opacity:.85}
@media (max-width:520px){#map{display:none}.info b{font-size:17px}}
@media (prefers-reduced-motion:reduce){.hs i{animation:none}}
</style>
</head>
<body>
<div id="stage" aria-label="Visita online do imóvel"></div>
<header>
  <div class="brand">Sua Imobiliária<small>Tour online</small></div>
  <div class="room" id="roomName">Fachada</div>
</header>
<div class="tag">Demonstração · imóvel ilustrativo</div>
<div id="map" aria-label="Planta do imóvel"></div>
<div class="hint" id="hint">Arraste para olhar em volta<br>e toque nas setas para andar pelo imóvel</div>
<footer>
  <div class="chips" id="chips"></div>
  <div class="info">
    <div><b>Apartamento 2 dorms · 78 m²</b><p>1 suíte · varanda · 1 vaga · R$ 690.000</p></div>
    <a class="cta" id="cta" href="#" target="_blank" rel="noopener">Agendar visita</a>
  </div>
</footer>
<script>
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const R={
 fachada:{n:'Fachada',img:'imobdemo-fachada.jpg',hs:[{to:'sala',x:50,y:62,l:'Entrar'}]},
 sala:{n:'Sala de estar',img:'imobdemo-sala.jpg',hs:[{to:'jantar',x:22,y:55,l:'Sala de jantar'},{to:'cozinha',x:70,y:46,l:'Cozinha'},{to:'suite',x:88,y:58,l:'Quartos'}]},
 jantar:{n:'Sala de jantar',img:'imobdemo-jantar.jpg',hs:[{to:'sala',x:75,y:60,l:'Sala de estar'},{to:'cozinha',x:30,y:52,l:'Cozinha'}]},
 cozinha:{n:'Cozinha',img:'imobdemo-cozinha.jpg',hs:[{to:'jantar',x:80,y:62,l:'Sala de jantar'},{to:'sala',x:20,y:66,l:'Sala de estar'}]},
 suite:{n:'Suíte',img:'imobdemo-suite.jpg',hs:[{to:'banheiro',x:18,y:55,l:'Banheiro'},{to:'quarto2',x:84,y:58,l:'Quarto 2'},{to:'sala',x:50,y:82,l:'Voltar à sala'}]},
 quarto2:{n:'Quarto 2',img:'imobdemo-quarto2.jpg',hs:[{to:'suite',x:15,y:60,l:'Suíte'},{to:'sala',x:85,y:62,l:'Sala de estar'}]},
 banheiro:{n:'Banheiro',img:'imobdemo-banheiro.jpg',hs:[{to:'suite',x:75,y:70,l:'Suíte'}]}
};
// planta simplificada
const P={fachada:[4,84,92,12],sala:[4,40,50,42],jantar:[4,4,30,34],cozinha:[36,4,18,34],suite:[58,4,38,40],banheiro:[58,46,16,36],quarto2:[76,46,20,36]};
const map=document.getElementById('map');
map.innerHTML='<svg viewBox="0 0 100 100">'+Object.keys(P).map(k=>{const [x,y,w,h]=P[k];return `<rect data-k="${k}" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/><text x="${x+2}" y="${y+8}">${R[k].n.split(' ')[0]}</text>`}).join('')+'</svg>';
map.querySelectorAll('rect').forEach(r=>r.onclick=()=>go(r.dataset.k));
const chips=document.getElementById('chips');
chips.innerHTML=Object.keys(R).map(k=>`<button data-k="${k}">${R[k].n}</button>`).join('');
chips.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.k));
document.getElementById('cta').href='https://wa.me/5511990015443?text='+encodeURIComponent('Olá! Vi o tour online do apartamento de 2 dormitórios e quero agendar uma visita.');
Object.values(R).forEach(r=>{const i=new Image();i.src=r.img});
const stage=document.getElementById('stage');
let cur=null,layer=null,pan=0,busy=false;
function build(k){
  const L=document.createElement('div');L.className='layer';
  const im=document.createElement('div');im.className='img';im.style.backgroundImage=`url(${R[k].img})`;L.appendChild(im);
  R[k].hs.forEach(h=>{const b=document.createElement('button');b.className='hs';b.style.left=h.x+'%';b.style.top=h.y+'%';b.innerHTML='<i>'+ICON+'</i><span>'+h.l+'</span>';b.onclick=e=>{e.stopPropagation();go(h.to,h)};im.appendChild(b)});
  return L;
}
function setPan(p){if(!layer)return;const im=layer.firstChild;const extra=Math.max(0,im.offsetWidth-stage.offsetWidth)/2;pan=Math.max(-extra,Math.min(extra,p));im.style.transform=`translateX(calc(-50% + ${pan}px))`}
function go(k,h){
  if(busy||k===cur)return;busy=true;hint.classList.add('off');
  const next=build(k);next.style.opacity=0;next.style.transform='scale(1.18)';stage.appendChild(next);
  const old=layer;const ox=h?h.x:50,oy=h?h.y:55;
  if(old){old.style.transformOrigin=ox+'% '+oy+'%';old.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.9)',opacity:0}],{duration:900,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'})}
  next.animate([{transform:'scale(1.18)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:900,delay:old?250:0,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}).onfinish=()=>{next.style.opacity=1;next.style.transform='none';if(old)old.remove();busy=false};
  layer=next;cur=k;pan=0;requestAnimationFrame(()=>{const hs=R[k].hs;const mx=hs.reduce((a,b)=>a+b.x,0)/hs.length;setPan((0.5-mx/100)*next.firstChild.offsetWidth)});
  document.getElementById('roomName').textContent=R[k].n;
  chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  map.querySelectorAll('rect').forEach(r=>r.classList.toggle('on',r.dataset.k===k));
  const on=chips.querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
let sx=null,sp=0;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.hs'))return;sx=e.clientX;sp=pan;stage.classList.add('drag');hint.classList.add('off')});
addEventListener('pointermove',e=>{if(sx!==null)setPan(sp+(e.clientX-sx))});
addEventListener('pointerup',()=>{sx=null;stage.classList.remove('drag')});
addEventListener('resize',()=>setPan(pan));
const hint=document.getElementById('hint');setTimeout(()=>hint.classList.add('off'),4500);
go('fachada');
</script>
</body>
</html>
